name: PULSE-082 Apply

on:
  push:
    branches: [pulse/pulse-082-driver-upcoming]
    paths:
      - 'scripts/pulse-082-apply.py'
      - '.github/workflows/pulse-082-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pulse/pulse-082-driver-upcoming
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply PULSE-082 scoped patch
        run: python scripts/pulse-082-apply.py
      - name: Commit staged runtime package
        run: |
          git config user.name "Pulse Forge"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "PULSE-082: build driver upcoming ride surface"
          git push origin HEAD:pulse/pulse-082-driver-upcoming
