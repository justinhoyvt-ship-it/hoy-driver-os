name: PULSE-084 Apply
on:
  push:
    branches: [pulse/pulse-084-fare-receipt-continuity]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pulse/pulse-084-fare-receipt-continuity
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply scoped PULSE-084 changes
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          function mustReplace(path, before, after){
            let s=fs.readFileSync(path,'utf8');
            if(!s.includes(before)) throw new Error('missing anchor in '+path+': '+before.slice(0,90));
            s=s.replace(before,after);
            fs.writeFileSync(path,s);
          }
          function mustRegex(path,re,after){
            let s=fs.readFileSync(path,'utf8');
            if(!re.test(s)) throw new Error('missing regex anchor in '+path+': '+re);
            s=s.replace(re,after);
            fs.writeFileSync(path,s);
          }

          // Driver server: carry fare directly into confirmed Scheduled projection.
          mustReplace('apps-script/hoy-driver-os-writer/Code.gs',
`      whenISO: r.whenISO,
      source: 'rider',
      status: r.status`,
`      whenISO: r.whenISO,
      quotedFare: r.quotedFare,
      source: 'rider',
      status: r.status`);

          // Driver Scheduled card: one glanceable line of time, route, fare, start.
          let fg=fs.readFileSync('apps-script/hoy-driver-os-writer/ForegroundPickup.html','utf8');
          fg=fg.replace(/<style id="pulse082-style">[\s\S]*?<\/style>/,
`<style id="pulse082-style">
  .sched-card.p082-card{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:16px 14px;border-radius:16px;background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.025));overflow:hidden}
  .p084-main{min-width:0;display:grid;gap:7px}
  .p084-timefare{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
  .p084-time{font-family:var(--mono);font-size:.78rem;color:var(--sun);font-weight:700;white-space:nowrap}
  .p084-fare{font-family:var(--display);font-size:1.05rem;font-weight:800;color:var(--green);white-space:nowrap}
  .p084-route{font-family:var(--display);font-size:.92rem;font-weight:650;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
  .p084-action button{min-height:48px;padding:0 18px;border:0;border-radius:12px;background:linear-gradient(180deg,#8ff5c1,var(--green) 55%,#1f9c63);color:#04220f;font-family:var(--display);font-size:.78rem;font-weight:800;white-space:nowrap}
  .p084-action button:disabled{opacity:.42}
  .p082-empty{font-size:.76rem;color:var(--muted);padding:2px 1px}
  @media(max-width:430px){.sched-card.p082-card{grid-template-columns:1fr}.p084-action button{width:100%}.p084-route{white-space:normal}}
</style>`);
          const start=fg.indexOf('  function p082When_(s){');
          const end=fg.indexOf('  startScheduled=function(id){',start);
          if(start<0||end<0) throw new Error('scheduled renderer anchors missing');
          const replacement=`  function p084Time_(s){var d=new Date(Number(s.whenTS)||0);return isNaN(d.getTime())?'Time pending':d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});}\n  function p082Fare_(s){var raw=s&&s.quotedFare;if(raw===null||raw===''||raw===undefined)return null;var fare=Number(raw);return isFinite(fare)&&fare>=0?fare:null;}\n  function p082Button_(label,cls,disabled,handler){var b=document.createElement('button');b.type='button';b.textContent=label;b.className=cls||'';b.disabled=!!disabled;b.onclick=handler;return b;}\n\n  renderSched=function(){\n    var lane=$('schedList');if(!lane)return;lane.innerHTML='';\n    var rides=(S.scheduled||[]).slice().sort(function(a,b){return (a.whenTS||0)-(b.whenTS||0)});\n    if(!rides.length){var empty=document.createElement('div');empty.className='p082-empty';empty.textContent='No upcoming rides';lane.appendChild(empty);return;}\n    rides.forEach(function(s){\n      var fare=p082Fare_(s),card=document.createElement('div');card.className='sched-card p082-card';\n      var main=document.createElement('div');main.className='p084-main';\n      var tf=document.createElement('div');tf.className='p084-timefare';\n      var time=document.createElement('div');time.className='p084-time';time.textContent=p084Time_(s);tf.appendChild(time);\n      var fareEl=document.createElement('div');fareEl.className='p084-fare';fareEl.textContent=fare!=null?'$'+money(fare):'Fare pending';tf.appendChild(fareEl);main.appendChild(tf);\n      var route=document.createElement('div');route.className='p084-route';route.textContent=(s.pickup||'Pickup')+' → '+(s.dest||'Destination');main.appendChild(route);card.appendChild(main);\n      var action=document.createElement('div');action.className='p084-action';action.appendChild(p082Button_('Start ride','',!!scheduledStartBusy[s.id]||!!S.active||!!S.queued,function(){startScheduled(s.id)}));card.appendChild(action);lane.appendChild(card);\n    });\n  };\n\n`;
          fg=fg.slice(0,start)+replacement+fg.slice(end);
          fs.writeFileSync('apps-script/hoy-driver-os-writer/ForegroundPickup.html',fg);

          // Request form success copy.
          mustReplace('pulse-autobuild/request-app/RequestForm.html',
`<p id="doneMsg">Your driver has it and will confirm shortly. Watch your inbox for the confirmation.</p>`,
`<p id="doneMsg">Request sent to your Pulse driver. Watch your inbox for confirmation.</p>`);
          mustReplace('pulse-autobuild/request-app/RequestForm.html',
`$('doneMsg').textContent=res.driverName+' has it and will confirm shortly. Watch your inbox for the confirmation.';`,
`$('doneMsg').textContent='Request sent to your Pulse driver. Watch your inbox for confirmation.';`);

          // Request app configuration + receipt header.
          mustReplace('pulse-autobuild/request-app/Code.gs',
`    requestToken: String(p.getProperty('REQUEST_TOKEN') || '')`,
`    requestToken: String(p.getProperty('REQUEST_TOKEN') || ''),\n    emailHeroImageUrl: String(p.getProperty('EMAIL_HERO_IMAGE_URL') || 'https://drive.google.com/uc?export=view&id=1qclLLlc33_I9q6nzbwziUQvKQhbhktPJ')`);
          mustReplace('pulse-autobuild/request-app/Code.gs',
`    'Quoted Fare','Quote ID','Quote Expires At','Pricing Version'`,
`    'Quoted Fare','Quote ID','Quote Expires At','Pricing Version','Receipt Email Sent At'`);

          // Completion status should send a receipt without blocking ride completion if email fails.
          mustReplace('pulse-autobuild/request-app/Code.gs',
`  if (next === 'Complete' && rideState !== 'COMPLETED') {\n    updateRideCells_(found.rowIndex, { 'Status':'COMPLETED', 'Updated At':now, 'Completed At':now });\n  }\n  return Object.assign({ ok:true, duplicate:false }, event);`,
`  if (next === 'Complete' && rideState !== 'COMPLETED') {\n    updateRideCells_(found.rowIndex, { 'Status':'COMPLETED', 'Updated At':now, 'Completed At':now });\n    found.obj.Status = 'COMPLETED';\n    found.obj['Updated At'] = now;\n    found.obj['Completed At'] = now;\n  }\n  if (next === 'Complete') ensureCompletionReceiptSafe_(found);\n  return Object.assign({ ok:true, duplicate:false }, event);`);

          const codePath='pulse-autobuild/request-app/Code.gs';
          let code=fs.readFileSync(codePath,'utf8');
          const nStart=code.indexOf('function notifyCustomerReceived_(row) {');
          const nEnd=code.indexOf('function notifyCustomerDeclined_(obj) {',nStart);
          if(nStart<0||nEnd<0) throw new Error('customer email function anchors missing');
          const emailFns=`function rideFareText_(obj) {\n  const raw = obj && obj['Quoted Fare'];\n  const fare = Number(raw);\n  return raw !== '' && raw !== null && raw !== undefined && Number.isFinite(fare) ? '$' + fare.toFixed(2) : 'Fare pending';\n}\n\nfunction pulseEmailHtml_(title, lead, obj, options) {\n  options = options || {};\n  const cfg = rideCfg_();\n  const image = cfg.emailHeroImageUrl ? '<img src="' + esc_(cfg.emailHeroImageUrl) + '" alt="Pulse Vermont ride" style="display:block;width:100%;max-height:250px;object-fit:cover;border:0">' : '';\n  const button = options.buttonUrl ? '<p style="margin:26px 0 6px"><a href="' + esc_(options.buttonUrl) + '" style="display:inline-block;background:#45e394;color:#062718;text-decoration:none;font-weight:800;padding:14px 22px;border-radius:10px">' + esc_(options.buttonLabel || 'Open') + '</a></p>' : '';\n  const security = options.securityHtml || '';\n  return '<div style="margin:0;background:#08111f;padding:24px 10px;font-family:Arial,sans-serif;color:#f7f9fb"><div style="max-width:620px;margin:0 auto;background:#101b2c;border:1px solid #29465c;border-radius:20px;overflow:hidden">' + image + '<div style="padding:26px"><div style="font-size:12px;letter-spacing:2px;color:#59d8ff;font-weight:800">PULSE VERMONT</div><h1 style="margin:8px 0 8px;font-size:30px;line-height:1.05">' + esc_(title) + '</h1><p style="margin:0 0 22px;color:#bdd0de;font-size:16px;line-height:1.5">' + esc_(lead) + '</p><table role="presentation" style="width:100%;border-collapse:collapse;font-size:15px"><tr><td style="padding:9px 0;color:#8199aa">When</td><td style="padding:9px 0;text-align:right;font-weight:700">' + esc_(formatPickup_(obj['Pickup At'])) + '</td></tr><tr><td style="padding:9px 0;color:#8199aa">From</td><td style="padding:9px 0;text-align:right;font-weight:700">' + esc_(obj['Pickup Address']) + '</td></tr><tr><td style="padding:9px 0;color:#8199aa">To</td><td style="padding:9px 0;text-align:right;font-weight:700">' + esc_(obj['Destination']) + '</td></tr><tr><td style="padding:14px 0 8px;color:#8199aa;border-top:1px solid #29465c">Fare</td><td style="padding:14px 0 8px;text-align:right;font-size:26px;font-weight:800;color:#6ee7b7;border-top:1px solid #29465c">' + esc_(rideFareText_(obj)) + '</td></tr></table>' + button + security + '<p style="margin:24px 0 0;color:#688092;font-size:12px">Local rides · Pulse Vermont</p></div></div></div>';\n}\n\nfunction notifyCustomerReceived_(row) {\n  MailApp.sendEmail({\n    to: row['Customer Email'],\n    subject: 'Ride request received',\n    body: 'Hi ' + row['Customer Name'] + ',\\n\\nRequest sent to your Pulse driver. It is not confirmed yet.\\n\\nWhen: ' + formatPickup_(row['Pickup At']) + '\\nFrom: ' + row['Pickup Address'] + '\\nTo: ' + row['Destination'] + '\\nFare: ' + rideFareText_(row) + '\\n\\nYou will receive another email after the driver confirms or declines it.\\n',\n    htmlBody: pulseEmailHtml_('Request received', 'Request sent to your Pulse driver. It is not confirmed yet.', row, {})\n  });\n}\n\nfunction notifyCustomerConfirmed_(obj, access) {\n  const cfg = rideCfg_();\n  if (!access || !access.rideId || !access.pin) throw new Error('Ride access details are required for confirmation email.');\n  const statusUrl = rideStatusAccessUrl_(access.rideId);\n  const security = '<div style="margin-top:22px;padding:14px;border-radius:10px;background:#0a1423;color:#9db0c1;font-size:12px;line-height:1.55">Ride ID: <b style="color:#fff">' + esc_(access.rideId) + '</b><br>PIN: <b style="color:#fff">' + esc_(access.pin) + '</b><br>Keep these private. They are the fallback access details for this ride.</div>';\n  MailApp.sendEmail({\n    to: obj['Customer Email'],\n    subject: 'Ride confirmed — ' + formatPickup_(obj['Pickup At']),\n    body: 'Hi ' + obj['Customer Name'] + ',\\n\\nYour ride is confirmed.\\n\\nDriver: ' + cfg.driverName + (cfg.vehicle ? ' · ' + cfg.vehicle : '') + '\\n' + (cfg.driverPhone ? 'Driver phone: ' + cfg.driverPhone + '\\n' : '') + 'When: ' + formatPickup_(obj['Pickup At']) + '\\nPickup: ' + obj['Pickup Address'] + '\\nDestination: ' + obj['Destination'] + '\\nFare: ' + rideFareText_(obj) + '\\n\\nRide ID: ' + access.rideId + '\\nPIN: ' + access.pin + '\\nStatus link: ' + statusUrl + '\\n',\n    htmlBody: pulseEmailHtml_('Ride confirmed', cfg.driverName + (cfg.vehicle ? ' · ' + cfg.vehicle : '') + ' will be your driver.', obj, {buttonUrl:statusUrl,buttonLabel:'Track my ride',securityHtml:security})\n  });\n}\n\nfunction notifyCustomerCompleted_(obj) {\n  const again = requestUrl_();\n  MailApp.sendEmail({\n    to: obj['Customer Email'],\n    subject: 'Your Pulse ride receipt — ' + rideFareText_(obj),\n    body: 'Hi ' + obj['Customer Name'] + ',\\n\\nRide complete. Thanks for riding with Pulse Vermont.\\n\\nWhen: ' + formatPickup_(obj['Pickup At']) + '\\nFrom: ' + obj['Pickup Address'] + '\\nTo: ' + obj['Destination'] + '\\nFare: ' + rideFareText_(obj) + '\\n\\nRequest another ride: ' + again + '\\n',\n    htmlBody: pulseEmailHtml_('Thanks for riding', 'Your ride is complete. Here is your receipt.', obj, {buttonUrl:again,buttonLabel:'Request another ride'})\n  });\n}\n\nfunction ensureCompletionReceiptSafe_(found) {\n  if (!found || !found.obj || found.obj['Receipt Email Sent At']) return false;\n  try {\n    notifyCustomerCompleted_(found.obj);\n    const sentAt = new Date();\n    updateRideCells_(found.rowIndex, {'Receipt Email Sent At':sentAt});\n    found.obj['Receipt Email Sent At'] = sentAt;\n    return true;\n  } catch (error) {\n    console.log('Completion receipt warning: ' + String((error && error.message) || error));\n    return false;\n  }\n}\n\n`;
          code=code.slice(0,nStart)+emailFns+code.slice(nEnd);
          fs.writeFileSync(codePath,code);

          // Validators and package wiring.
          fs.writeFileSync('pulse-forge/tests/validate-pulse-084-fare-receipt.mjs',`import fs from 'node:fs';\nimport path from 'node:path';\nconst root=path.resolve(import.meta.dirname,'../..');\nconst read=p=>fs.readFileSync(path.join(root,p),'utf8');\nconst driver=read('apps-script/hoy-driver-os-writer/Code.gs');\nconst fg=read('apps-script/hoy-driver-os-writer/ForegroundPickup.html');\nconst code=read('pulse-autobuild/request-app/Code.gs');\nconst form=read('pulse-autobuild/request-app/RequestForm.html');\nfor(const x of ['quotedFare: r.quotedFare']) if(!driver.includes(x)) throw new Error('scheduled fare projection missing');\nfor(const x of ['p084-timefare','Start ride','Fare pending']) if(!fg.includes(x)) throw new Error('driver scheduled card missing '+x);\nfor(const x of ['Receipt Email Sent At','notifyCustomerCompleted_','Request another ride','htmlBody: pulseEmailHtml_','rideFareText_']) if(!code.includes(x)) throw new Error('email continuity missing '+x);\nif(!form.includes('Request sent to your Pulse driver.')) throw new Error('request success copy not updated');\nconsole.log('PULSE-084 fare, scheduled card, branded email, and receipt validation passed');\n`);
          const pkgPath='pulse-forge/package.json';
          const pkg=JSON.parse(fs.readFileSync(pkgPath,'utf8'));
          if(!pkg.scripts.validate.includes('validate-pulse-084-fare-receipt.mjs')) pkg.scripts.validate += ' && node tests/validate-pulse-084-fare-receipt.mjs';
          fs.writeFileSync(pkgPath,JSON.stringify(pkg,null,2)+'\n');
          NODE
      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/pulse-084-apply.yml
          git config user.name "Pulse Builder"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "PULSE-084: fare continuity branded receipts and scheduled card"
          git push origin HEAD:pulse/pulse-084-fare-receipt-continuity
