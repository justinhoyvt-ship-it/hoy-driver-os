name: PULSE-084 Apply 2
on:
  push:
    branches:
      - pulse/pulse-084-fare-receipt-continuity
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pulse/pulse-084-fare-receipt-continuity
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply PULSE-084
        run: |
          cat > /tmp/p084.cjs <<'NODE'
          const fs=require('fs');
          function rep(path,before,after){let s=fs.readFileSync(path,'utf8');if(!s.includes(before))throw new Error('missing anchor '+path+' '+before.slice(0,80));fs.writeFileSync(path,s.replace(before,after));}
          rep('apps-script/hoy-driver-os-writer/Code.gs',"      whenISO: r.whenISO,\n      source: 'rider',\n      status: r.status","      whenISO: r.whenISO,\n      quotedFare: r.quotedFare,\n      source: 'rider',\n      status: r.status");
          let fg=fs.readFileSync('apps-script/hoy-driver-os-writer/ForegroundPickup.html','utf8');
          fg=fg.replace(/<style id="pulse082-style">[\s\S]*?<\/style>/,`<style id="pulse082-style">
  .sched-card.p082-card{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:16px 14px;border-radius:16px;background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.025));overflow:hidden}
  .p084-main{min-width:0;display:grid;gap:7px}.p084-timefare{display:flex;align-items:baseline;justify-content:space-between;gap:12px}.p084-time{font-family:var(--mono);font-size:.78rem;color:var(--sun);font-weight:700;white-space:nowrap}.p084-fare{font-family:var(--display);font-size:1.05rem;font-weight:800;color:var(--green);white-space:nowrap}.p084-route{font-family:var(--display);font-size:.92rem;font-weight:650;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}.p084-action button{min-height:48px;padding:0 18px;border:0;border-radius:12px;background:linear-gradient(180deg,#8ff5c1,var(--green) 55%,#1f9c63);color:#04220f;font-family:var(--display);font-size:.78rem;font-weight:800;white-space:nowrap}.p084-action button:disabled{opacity:.42}.p082-empty{font-size:.76rem;color:var(--muted);padding:2px 1px}@media(max-width:430px){.sched-card.p082-card{grid-template-columns:1fr}.p084-action button{width:100%}.p084-route{white-space:normal}}
</style>`);
          const a=fg.indexOf('  function p082When_(s){'),b=fg.indexOf('  startScheduled=function(id){',a);if(a<0||b<0)throw new Error('scheduled renderer anchors missing');
          const rr=`  function p084Time_(s){var d=new Date(Number(s.whenTS)||0);return isNaN(d.getTime())?'Time pending':d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});}\n  function p082Fare_(s){var raw=s&&s.quotedFare;if(raw===null||raw===''||raw===undefined)return null;var fare=Number(raw);return isFinite(fare)&&fare>=0?fare:null;}\n  function p082Button_(label,cls,disabled,handler){var x=document.createElement('button');x.type='button';x.textContent=label;x.className=cls||'';x.disabled=!!disabled;x.onclick=handler;return x;}\n\n  renderSched=function(){var lane=$('schedList');if(!lane)return;lane.innerHTML='';var rides=(S.scheduled||[]).slice().sort(function(x,y){return (x.whenTS||0)-(y.whenTS||0)});if(!rides.length){var e=document.createElement('div');e.className='p082-empty';e.textContent='No upcoming rides';lane.appendChild(e);return;}rides.forEach(function(s){var fare=p082Fare_(s),card=document.createElement('div');card.className='sched-card p082-card';var main=document.createElement('div');main.className='p084-main';var tf=document.createElement('div');tf.className='p084-timefare';var tm=document.createElement('div');tm.className='p084-time';tm.textContent=p084Time_(s);tf.appendChild(tm);var fe=document.createElement('div');fe.className='p084-fare';fe.textContent=fare!=null?'$'+money(fare):'Fare pending';tf.appendChild(fe);main.appendChild(tf);var route=document.createElement('div');route.className='p084-route';route.textContent=(s.pickup||'Pickup')+' → '+(s.dest||'Destination');main.appendChild(route);card.appendChild(main);var action=document.createElement('div');action.className='p084-action';action.appendChild(p082Button_('Start ride','',!!scheduledStartBusy[s.id]||!!S.active||!!S.queued,function(){startScheduled(s.id)}));card.appendChild(action);lane.appendChild(card);});};\n\n`;
          fg=fg.slice(0,a)+rr+fg.slice(b);fs.writeFileSync('apps-script/hoy-driver-os-writer/ForegroundPickup.html',fg);
          rep('pulse-autobuild/request-app/RequestForm.html','<p id="doneMsg">Your driver has it and will confirm shortly. Watch your inbox for the confirmation.</p>','<p id="doneMsg">Request sent to your Pulse driver. Watch your inbox for confirmation.</p>');
          rep('pulse-autobuild/request-app/RequestForm.html',"$('doneMsg').textContent=res.driverName+' has it and will confirm shortly. Watch your inbox for the confirmation.';","$('doneMsg').textContent='Request sent to your Pulse driver. Watch your inbox for confirmation.';");
          rep('pulse-autobuild/request-app/Code.gs',"    requestToken: String(p.getProperty('REQUEST_TOKEN') || '')","    requestToken: String(p.getProperty('REQUEST_TOKEN') || ''),\n    emailHeroImageUrl: String(p.getProperty('EMAIL_HERO_IMAGE_URL') || 'https://drive.google.com/uc?export=view&id=1qclLLlc33_I9q6nzbwziUQvKQhbhktPJ')");
          rep('pulse-autobuild/request-app/Code.gs',"    'Quoted Fare','Quote ID','Quote Expires At','Pricing Version'","    'Quoted Fare','Quote ID','Quote Expires At','Pricing Version','Receipt Email Sent At'");
          rep('pulse-autobuild/request-app/Code.gs',"  if (next === 'Complete' && rideState !== 'COMPLETED') {\n    updateRideCells_(found.rowIndex, { 'Status':'COMPLETED', 'Updated At':now, 'Completed At':now });\n  }\n  return Object.assign({ ok:true, duplicate:false }, event);","  if (next === 'Complete' && rideState !== 'COMPLETED') {\n    updateRideCells_(found.rowIndex, { 'Status':'COMPLETED', 'Updated At':now, 'Completed At':now });\n    found.obj.Status = 'COMPLETED'; found.obj['Updated At'] = now; found.obj['Completed At'] = now;\n  }\n  if (next === 'Complete') ensureCompletionReceiptSafe_(found);\n  return Object.assign({ ok:true, duplicate:false }, event);");
          const cp='pulse-autobuild/request-app/Code.gs';let c=fs.readFileSync(cp,'utf8');const s=c.indexOf('function notifyCustomerReceived_(row) {'),e=c.indexOf('function notifyCustomerDeclined_(obj) {',s);if(s<0||e<0)throw new Error('email anchors missing');
          const f=`function rideFareText_(obj) { const raw=obj&&obj['Quoted Fare'],fare=Number(raw); return raw!==''&&raw!==null&&raw!==undefined&&Number.isFinite(fare)?'$'+fare.toFixed(2):'Fare pending'; }\nfunction pulseEmailHtml_(title,lead,obj,options){options=options||{};const cfg=rideCfg_();const image=cfg.emailHeroImageUrl?'<img src="'+esc_(cfg.emailHeroImageUrl)+'" alt="Pulse Vermont ride" style="display:block;width:100%;max-height:250px;object-fit:cover;border:0">':'';const button=options.buttonUrl?'<p style="margin:26px 0 6px"><a href="'+esc_(options.buttonUrl)+'" style="display:inline-block;background:#45e394;color:#062718;text-decoration:none;font-weight:800;padding:14px 22px;border-radius:10px">'+esc_(options.buttonLabel||'Open')+'</a></p>':'';return '<div style="margin:0;background:#08111f;padding:24px 10px;font-family:Arial,sans-serif;color:#f7f9fb"><div style="max-width:620px;margin:0 auto;background:#101b2c;border:1px solid #29465c;border-radius:20px;overflow:hidden">'+image+'<div style="padding:26px"><div style="font-size:12px;letter-spacing:2px;color:#59d8ff;font-weight:800">PULSE VERMONT</div><h1 style="margin:8px 0;font-size:30px">'+esc_(title)+'</h1><p style="color:#bdd0de;font-size:16px">'+esc_(lead)+'</p><table role="presentation" style="width:100%;border-collapse:collapse;font-size:15px"><tr><td style="padding:9px 0;color:#8199aa">When</td><td style="padding:9px 0;text-align:right;font-weight:700">'+esc_(formatPickup_(obj['Pickup At']))+'</td></tr><tr><td style="padding:9px 0;color:#8199aa">From</td><td style="padding:9px 0;text-align:right;font-weight:700">'+esc_(obj['Pickup Address'])+'</td></tr><tr><td style="padding:9px 0;color:#8199aa">To</td><td style="padding:9px 0;text-align:right;font-weight:700">'+esc_(obj['Destination'])+'</td></tr><tr><td style="padding:14px 0;color:#8199aa;border-top:1px solid #29465c">Fare</td><td style="padding:14px 0;text-align:right;font-size:26px;font-weight:800;color:#6ee7b7;border-top:1px solid #29465c">'+esc_(rideFareText_(obj))+'</td></tr></table>'+button+(options.securityHtml||'')+'<p style="margin:24px 0 0;color:#688092;font-size:12px">Local rides · Pulse Vermont</p></div></div></div>'; }\nfunction notifyCustomerReceived_(row){MailApp.sendEmail({to:row['Customer Email'],subject:'Ride request received',body:'Hi '+row['Customer Name']+',\\n\\nRequest sent to your Pulse driver. It is not confirmed yet.\\n\\nWhen: '+formatPickup_(row['Pickup At'])+'\\nFrom: '+row['Pickup Address']+'\\nTo: '+row['Destination']+'\\nFare: '+rideFareText_(row)+'\\n',htmlBody:pulseEmailHtml_('Request received','Request sent to your Pulse driver. It is not confirmed yet.',row,{})});}\nfunction notifyCustomerConfirmed_(obj,access){const cfg=rideCfg_();if(!access||!access.rideId||!access.pin)throw new Error('Ride access details are required for confirmation email.');const url=rideStatusAccessUrl_(access.rideId),security='<div style="margin-top:22px;padding:14px;border-radius:10px;background:#0a1423;color:#9db0c1;font-size:12px;line-height:1.55">Ride ID: <b style="color:#fff">'+esc_(access.rideId)+'</b><br>PIN: <b style="color:#fff">'+esc_(access.pin)+'</b><br>Keep these private as fallback access details.</div>';MailApp.sendEmail({to:obj['Customer Email'],subject:'Ride confirmed — '+formatPickup_(obj['Pickup At']),body:'Your ride is confirmed.\\nFare: '+rideFareText_(obj)+'\\nStatus: '+url+'\\nRide ID: '+access.rideId+'\\nPIN: '+access.pin,htmlBody:pulseEmailHtml_('Ride confirmed',cfg.driverName+(cfg.vehicle?' · '+cfg.vehicle:'')+' will be your driver.',obj,{buttonUrl:url,buttonLabel:'Track my ride',securityHtml:security})});}\nfunction notifyCustomerCompleted_(obj){const again=requestUrl_();MailApp.sendEmail({to:obj['Customer Email'],subject:'Your Pulse ride receipt — '+rideFareText_(obj),body:'Ride complete. Thanks for riding with Pulse Vermont.\\nFare: '+rideFareText_(obj)+'\\nFrom: '+obj['Pickup Address']+'\\nTo: '+obj['Destination']+'\\nRequest another ride: '+again,htmlBody:pulseEmailHtml_('Thanks for riding','Your ride is complete. Here is your receipt.',obj,{buttonUrl:again,buttonLabel:'Request another ride'})});}\nfunction ensureCompletionReceiptSafe_(found){if(!found||!found.obj||found.obj['Receipt Email Sent At'])return false;try{notifyCustomerCompleted_(found.obj);const at=new Date();updateRideCells_(found.rowIndex,{'Receipt Email Sent At':at});found.obj['Receipt Email Sent At']=at;return true;}catch(error){console.log('Completion receipt warning: '+String((error&&error.message)||error));return false;}}\n\n`;
          c=c.slice(0,s)+f+c.slice(e);fs.writeFileSync(cp,c);
          fs.writeFileSync('pulse-forge/tests/validate-pulse-084-fare-receipt.mjs',`import fs from 'node:fs';import path from 'node:path';const root=path.resolve(import.meta.dirname,'../..');const read=p=>fs.readFileSync(path.join(root,p),'utf8');const d=read('apps-script/hoy-driver-os-writer/Code.gs'),g=read('apps-script/hoy-driver-os-writer/ForegroundPickup.html'),c=read('pulse-autobuild/request-app/Code.gs'),f=read('pulse-autobuild/request-app/RequestForm.html');if(!d.includes('quotedFare: r.quotedFare'))throw new Error('scheduled fare projection');for(const x of ['p084-timefare','Start ride','Fare pending'])if(!g.includes(x))throw new Error(x);for(const x of ['Receipt Email Sent At','notifyCustomerCompleted_','Request another ride','htmlBody:pulseEmailHtml_'])if(!c.includes(x))throw new Error(x);if(!f.includes('Request sent to your Pulse driver.'))throw new Error('success copy');console.log('PULSE-084 PASS');\n`);
          const pp='pulse-forge/package.json',pkg=JSON.parse(fs.readFileSync(pp,'utf8'));if(!pkg.scripts.validate.includes('validate-pulse-084-fare-receipt.mjs'))pkg.scripts.validate+=' && node tests/validate-pulse-084-fare-receipt.mjs';fs.writeFileSync(pp,JSON.stringify(pkg,null,2)+'\n');
          NODE
          node /tmp/p084.cjs
      - name: Commit
        run: |
          rm -f .github/workflows/pulse-084-apply.yml .github/workflows/pulse-084-apply2.yml
          git config user.name "Pulse Builder"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "PULSE-084: fare continuity branded receipts and scheduled card"
          git push origin HEAD:pulse/pulse-084-fare-receipt-continuity
