name: Pulse Forge CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'pulse-forge/**'
      - 'pulse-agent/tasks/PULSE-076.json'
      - '.github/workflows/pulse-forge-ci.yml'
  pull_request:
    paths:
      - 'pulse-forge/**'
      - 'pulse-agent/tasks/PULSE-076.json'
      - '.github/workflows/pulse-forge-ci.yml'

permissions:
  contents: read

jobs:
  validate-forge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Forge source and safety contract
        run: npm --prefix pulse-forge run validate
