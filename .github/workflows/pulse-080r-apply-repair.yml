name: PULSE-080R Apply Validated Repair

on:
  push:
    branches:
      - copilot/pulse-080r-permanent-builder-restoration

permissions:
  contents: write

env:
  REPAIR_BRANCH: copilot/pulse-080r-permanent-builder-restoration
  REPAIR_SHA256: c8028e4f7ea1547ea6b1c43b28f966ff4075f3e993f30fa440302e5c9afaf381

jobs:
  apply-validated-repair:
    if: ${{ !contains(github.event.head_commit.message, '[repair-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: copilot/pulse-080r-permanent-builder-restoration
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct and verify locked repair package
        shell: bash
        run: |
          set -euo pipefail
          node .pulse-repair/apply-repair.mjs
          echo "${REPAIR_SHA256}  .pulse-repair/PULSE-080R-PR50-repair.zip" | sha256sum --check --strict
      - name: Remove temporary transfer files and workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .pulse-repair
          rm -f .github/workflows/pulse-080r-apply-repair.yml
      - name: Validate complete Forge package
        run: npm --prefix pulse-forge run validate
      - name: Commit exact validated repair to existing PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Pulse Forge Repair"
          git config user.email "pulse-forge-repair@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No repair changes found"; exit 1; }
          git commit -m "PULSE-080R: apply validated permanent Builder repair [repair-applied]"
          git push origin HEAD:${REPAIR_BRANCH}
