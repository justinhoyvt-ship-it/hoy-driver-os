name: PULSE-058 Apply

on:
  push:
    branches:
      - pulse/pulse-058-fare-to-inbox

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'Carry signed fare quote into driver Inbox') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply PULSE-058 scoped patch
        run: node pulse-forge/tasks/PULSE-058/apply-patch.mjs
