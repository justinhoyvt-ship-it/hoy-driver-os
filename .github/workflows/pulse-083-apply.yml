name: PULSE-083 Apply Rider Journey
on:
  push:
    branches:
      - pulse/pulse-083-rider-journey
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pulse/pulse-083-rider-journey
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node pulse-forge/scripts/apply-pulse-083.mjs
      - run: |
          cat > pulse-forge/tests/validate-pulse-083-rider-journey.mjs <<'EOF'
          import fs from 'node:fs';
          const s=fs.readFileSync('pulse-autobuild/request-app/Code.gs','utf8');
          for(const x of ["'Confirmed':['Ride confirmed'","'On the way':['Driver on the way'","'Arrived':['Driver has arrived'","'Complete':['Ride complete'",'PULSE VERMONT','MY RIDE','prefers-reduced-motion']) if(!s.includes(x)) throw new Error('missing '+x);
          console.log('PULSE-083 rider journey validation passed');
          EOF
          node pulse-forge/tests/validate-pulse-083-rider-journey.mjs
      - run: |
          rm .github/workflows/pulse-083-apply.yml pulse-forge/scripts/apply-pulse-083.mjs
          git config user.name pulse-forge
          git config user.email pulse-forge@users.noreply.github.com
          git add -A
          git commit -m "PULSE-083: build rider journey status surface"
          git push
