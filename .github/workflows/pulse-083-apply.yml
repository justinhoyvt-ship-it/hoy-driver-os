name: PULSE-083 Apply Rider Journey
on:
  push:
    branches: [pulse/pulse-083-rider-journey]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pulse/pulse-083-rider-journey
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply scoped rider journey patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('pulse-autobuild/request-app/Code.gs')
          s=p.read_text()
          pattern=r"function renderRiderStatusPage_\(currentStatus, occurredAt\) \{.*?\n\}\n\nfunction formatStatusTime_"
          replacement=r'''function renderRiderStatusPage_(currentStatus, occurredAt) {
  const current = normalizeRiderStatus_(currentStatus);
  const cancelled = current === 'Cancelled';
  const currentIndex = riderStatusIndex_(current);
  const copy = {
    'Confirmed':['Ride confirmed','Your Pulse ride is booked.'],
    'Leaving':['Your driver is leaving','Your driver is getting on the road.'],
    'On the way':['Driver on the way','Your driver is headed to your pickup.'],
    'Arriving soon':['Arriving soon','Be ready at your pickup point.'],
    'Arrived':['Driver has arrived','Your Pulse ride is ready.'],
    'Ride in progress':['Ride in progress','You are on your way.'],
    'Complete':['Ride complete','Thanks for riding with Pulse Vermont.'],
    'Cancelled':['Ride cancelled','This ride is no longer active.']
  };
  const hero = copy[current] || ['Ride status','Updates from your driver.'];
  const rows = RIDE.RIDER_STATUS_SEQUENCE.map(function(label, index) {
    const cls = cancelled ? '' : (index < currentIndex ? 'done' : index === currentIndex ? 'current' : '');
    const mark = index < currentIndex ? '&#10003;' : (index === currentIndex ? '&#8226;' : '');
    return '<li class="' + cls + '"><span>' + mark + '</span><b>' + esc_(label) + '</b></li>';
  }).join('');
  const updated = occurredAt ? '<p class="updated">Updated ' + esc_(formatStatusTime_(occurredAt)) + '</p>' : '';
  const page = '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">' +
    '<meta name="theme-color" content="#08111f"><title>My Pulse ride</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,#17304b 0,#08111f 42%,#050a12 100%);color:#f7f9fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 18px env(safe-area-inset-bottom)}.shell{width:min(560px,100%);margin:0 auto;padding:28px 0 36px}.brand{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px}.brand b{letter-spacing:.16em;font-size:.78rem}.pill{border:1px solid #31506b;border-radius:999px;padding:7px 10px;color:#a9c4d8;font-size:.72rem;font-weight:800;letter-spacing:.08em}.hero{padding:24px;border:1px solid #25425a;border-radius:24px;background:linear-gradient(145deg,rgba(25,50,72,.94),rgba(11,23,38,.96));box-shadow:0 18px 50px rgba(0,0,0,.28)}.eyebrow{margin:0 0 10px;color:#6ee7b7;font-size:.76rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase}h1{margin:0;font-size:clamp(2rem,8vw,3.15rem);line-height:1.02;letter-spacing:-.04em}.lead{margin:12px 0 0;color:#bdd0de;font-size:1.02rem;line-height:1.45}.updated{margin:16px 0 0;color:#8199aa;font-size:.78rem}.progress{margin-top:18px;padding:22px;border:1px solid #1d3447;border-radius:22px;background:rgba(7,17,29,.86)}ol{list-style:none;padding:0;margin:0;display:grid;gap:0}li{position:relative;display:grid;grid-template-columns:34px 1fr;align-items:center;min-height:48px;color:#607487;font-size:.93rem}li:not(:last-child):after{content:"";position:absolute;left:15px;top:31px;bottom:-17px;width:2px;background:#20384b}li span{z-index:1;width:30px;height:30px;border:2px solid #29465c;border-radius:50%;display:grid;place-items:center;background:#091522;color:#07131b;font-size:1rem;font-weight:1000}li.done,li.current{color:#f7f9fb}li.done span{background:#6ee7b7;border-color:#6ee7b7}li.done:not(:last-child):after{background:#3f9f7e}li.current span{background:#59d8ff;border-color:#59d8ff;box-shadow:0 0 0 7px rgba(89,216,255,.10);font-size:1.5rem;line-height:0}.cancelled{margin-top:18px;padding:16px;border:1px solid #8b4351;border-radius:16px;background:#2b151c;color:#ffb2bf;font-weight:800}.foot{margin:20px 4px 0;color:#688092;font-size:.78rem;line-height:1.5;text-align:center}@media(prefers-reduced-motion:no-preference){li.current span{animation:pulse 1.8s ease-in-out infinite}@keyframes pulse{50%{box-shadow:0 0 0 12px rgba(89,216,255,.03)}}}</style></head>' +
    '<body><main class="shell"><div class="brand"><b>PULSE VERMONT</b><span class="pill">MY RIDE</span></div><section class="hero"><p class="eyebrow">Current status</p><h1>' + esc_(hero[0]) + '</h1><p class="lead">' + esc_(hero[1]) + '</p>' + updated + (cancelled ? '<div class="cancelled">This ride has been cancelled.</div>' : '') + '</section><section class="progress"><ol>' + rows + '</ol></section><p class="foot">This private page shows your ride progress only. Live location is not shared here yet.</p></main></body></html>';
  return HtmlService.createHtmlOutput(page).setTitle('My Pulse ride');
}

function formatStatusTime_'''
          ns,n=re.subn(pattern,replacement,s,flags=re.S)
          if n!=1: raise SystemExit(f'expected one rider status renderer, found {n}')
          p.write_text(ns)
          PY
      - name: Add PULSE-083 validation
        run: |
          cat > pulse-forge/tests/validate-pulse-083-rider-journey.mjs <<'EOF'
          import fs from 'node:fs';
          const p='pulse-autobuild/request-app/Code.gs';
          const s=fs.readFileSync(p,'utf8');
          const need=[
            "'Confirmed':['Ride confirmed'",
            "'On the way':['Driver on the way'",
            "'Arrived':['Driver has arrived'",
            "'Ride in progress':['Ride in progress'",
            "'Complete':['Ride complete'",
            'PULSE VERMONT',
            'MY RIDE',
            'RIDE.RIDER_STATUS_SEQUENCE',
            'prefers-reduced-motion'
          ];
          for (const x of need) if(!s.includes(x)) throw new Error('PULSE-083 missing '+x);
          if(!s.includes("return HtmlService.createHtmlOutput(page).setTitle('My Pulse ride')")) throw new Error('PULSE-083 title missing');
          console.log('PULSE-083 rider journey validation passed');
          EOF
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/pulse-083-apply.yml
          git config user.name pulse-forge
          git config user.email pulse-forge@users.noreply.github.com
          git add pulse-autobuild/request-app/Code.gs pulse-forge/tests/validate-pulse-083-rider-journey.mjs .github/workflows/pulse-083-apply.yml
          git commit -m "PULSE-083: build rider journey status surface"
          git push
