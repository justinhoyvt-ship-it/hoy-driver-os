name: PULSE-084 Apply
on:
  push:
    branches:
      - pulse/pulse-084-fare-receipt-continuity
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pulse/pulse-084-fare-receipt-continuity
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node pulse-forge/tools/pulse084-apply.cjs
      - run: |
          rm -f .github/workflows/pulse-084-apply.yml .github/workflows/pulse-084-apply2.yml .github/workflows/pulse-084-smoke.yml pulse-forge/tools/pulse084-apply.cjs
          git config user.name "Pulse Builder"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "PULSE-084: fare continuity branded receipts and scheduled card"
          git push origin HEAD:pulse/pulse-084-fare-receipt-continuity
