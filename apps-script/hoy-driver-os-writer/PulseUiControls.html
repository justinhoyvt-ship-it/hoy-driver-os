<style>
:root{--pulse-hit:48px;--pulse-focus:#8be9f2;--pulse-ok:#45e394;--pulse-bad:#ff6680;--pulse-warn:#f7b23b}
.pulse-control{min-width:var(--pulse-hit);min-height:var(--pulse-hit);touch-action:manipulation;position:relative;isolation:isolate}.pulse-control:focus-visible{outline:3px solid var(--pulse-focus);outline-offset:3px}.pulse-control[aria-busy="true"]{pointer-events:none;cursor:progress}.pulse-control[aria-busy="true"] .pulse-icon{animation:pulse-control-spin .8s linear infinite}.pulse-control.is-success{box-shadow:0 0 0 2px rgba(69,227,148,.45)}.pulse-control.is-error{box-shadow:0 0 0 2px rgba(255,102,128,.52)}.pulse-control.is-offline{filter:saturate(.62);opacity:.76}.pulse-control:disabled,.pulse-control[aria-disabled="true"]{opacity:.42;pointer-events:none}.pulse-control-content{display:inline-flex;align-items:center;justify-content:center;gap:9px;width:100%;min-width:0}.pulse-control-label{min-width:0}.pulse-icon{width:21px;height:21px;display:inline-grid;place-items:center;flex:0 0 auto}.pulse-icon svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.pulse-icon-only .pulse-control-label{display:none}.pulse-icon-only .pulse-control-content{gap:0}.pulse-toast-region{position:fixed;z-index:9999;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(92vw,460px);display:grid;gap:8px;pointer-events:none}.pulse-toast{pointer-events:auto;padding:12px 14px;border-radius:12px;background:rgba(10,15,36,.97);color:#eaf2ff;border:1px solid rgba(255,255,255,.14);box-shadow:0 14px 34px rgba(0,0,0,.42);font:600 14px/1.35 system-ui,sans-serif;display:flex;align-items:flex-start;gap:10px}.pulse-toast.success{border-color:rgba(69,227,148,.52)}.pulse-toast.error{border-color:rgba(255,102,128,.58)}.pulse-toast.warning{border-color:rgba(247,178,59,.58)}@keyframes pulse-control-spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
</style>
<script>
window.PulseUiControls=(function(){
'use strict';
var icons={
 menu:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="5" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="19" cy="5" r="1"/><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="19" r="1"/><circle cx="12" cy="19" r="1"/><circle cx="19" cy="19" r="1"/></svg>',
 inbox:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v14H4z"/><path d="M4 14h4l2 3h4l2-3h4"/></svg>',
 live:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 8.5a5 5 0 0 0 0 7M15.5 8.5a5 5 0 0 1 0 7"/><circle cx="12" cy="12" r="1.5"/></svg>',
 settings:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>',
 online:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v9M7 6.5a8 8 0 1 0 10 0"/></svg>',
 end:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h12v16H6zM9 8h6M9 12h6M9 16h4"/></svg>',
 check:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg>',
 x:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>',
 pickup:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s6-5 6-11a6 6 0 1 0-12 0c0 6 6 11 6 11z"/><circle cx="12" cy="10" r="2"/></svg>',
 start:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 11 7-11 7z"/></svg>',
 nav:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 21 3l-8.5 18-1.7-7.8z"/></svg>',
 save:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h12l2 2v14H5zM8 4v6h8V4M8 16h8"/></svg>',
 share:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="18" cy="5" r="2"/><circle cx="6" cy="12" r="2"/><circle cx="18" cy="19" r="2"/><path d="m8 11 8-5M8 13l8 5"/></svg>',
 qr:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h2v2h-2zM18 14h2v6h-6v-2M14 18h2"/></svg>'
};
function enhance(node){if(!node||node.dataset.pulseEnhanced)return;node.dataset.pulseEnhanced='1';node.classList.add('pulse-control');if(node.tagName==='BUTTON'&&!node.type)node.type='button'}
function wrap(node,iconName,opts){if(!node||node.querySelector('.pulse-control-content'))return;opts=opts||{};enhance(node);var original=node.innerHTML,label=opts.label!=null?opts.label:original;node.innerHTML='<span class="pulse-control-content"><span class="pulse-icon">'+(icons[iconName]||icons.check)+'</span><span class="pulse-control-label">'+label+'</span></span>';if(opts.iconOnly)node.classList.add('pulse-icon-only')}
function decorate(selector,iconName,opts){document.querySelectorAll(selector).forEach(function(node){wrap(node,iconName,opts)})}
function decorateByText(){document.querySelectorAll('.rider-flow-actions button:not([data-pulse-enhanced])').forEach(function(node){var t=(node.textContent||'').toLowerCase(),i=t.indexOf('route')>=0||t.indexOf('navigate')>=0?'nav':t.indexOf('start')>=0?'start':t.indexOf('arriv')>=0?'pickup':'check';wrap(node,i)})}
function toast(message,kind){var region=document.querySelector('.pulse-toast-region');if(!region){region=document.createElement('div');region.className='pulse-toast-region';region.setAttribute('aria-label','Pulse alerts');document.body.appendChild(region)}var item=document.createElement('div');item.className='pulse-toast '+(kind||'info');item.setAttribute('role',kind==='error'?'alert':'status');var icon=document.createElement('span');icon.className='pulse-icon';icon.innerHTML=kind==='error'?icons.x:(kind==='warning'?icons.pickup:icons.check);var text=document.createElement('span');text.textContent=String(message||'');item.appendChild(icon);item.appendChild(text);region.appendChild(item);setTimeout(function(){item.remove()},4500);return item}
function setState(node,state){enhance(node);node.classList.remove('is-success','is-error','is-offline');node.removeAttribute('aria-busy');if(state==='busy')node.setAttribute('aria-busy','true');if(state==='success')node.classList.add('is-success');if(state==='error')node.classList.add('is-error');if(state==='offline')node.classList.add('is-offline')}
function init(){document.querySelectorAll('button').forEach(enhance);decorate('#waffleBtn','menu',{iconOnly:true,label:'Menu'});decorate('#menuInbox','inbox');decorate('#menuLive','live');decorate('#menuSettings','settings');decorate('#goBtn','online');decorate('#endShiftBtn','end');decorate('#acceptBtn,.inbox-accept','check');decorate('#pickupBtn','pickup');decorate('#dropoffBtn','check');decorate('#cancelActiveBtn,.inbox-decline,#cancelSchedBtn,#cancelBtn,#skipFareBtn','x');decorate('#addSchedBtn','start');decorate('#saveSchedBtn,#saveBtn,#addFareBtn','save');decorate('#openQrFromInbox','qr');decorate('#openRideRequestBtn','start');decorate('#shareRideRequestBtn','share');decorate('#closeInboxBtn,#closeQrBtn','x',{iconOnly:true,label:'Close'});decorate('.sc-start','start');decorate('.sc-nav','nav');decorateByText()}
var observer=null,scheduled=false;function scheduleInit(){if(scheduled)return;scheduled=true;(window.requestAnimationFrame||function(fn){return setTimeout(fn,16)})(function(){scheduled=false;init()})}
function start(){init();if(observer)return;observer=new MutationObserver(scheduleInit);observer.observe(document.documentElement,{subtree:true,childList:true})}
return{init:start,toast:toast,setState:setState};
})();
</script>
