<style id="pulse082-style">
  .sched-card.p082-card{display:block;padding:12px;border-radius:14px;background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.025));overflow:hidden}
  .sched-card.p082-card.p082-featured{border-color:rgba(43,212,229,.48);background:linear-gradient(145deg,rgba(43,212,229,.12),rgba(76,147,255,.07) 55%,rgba(255,255,255,.025));box-shadow:0 10px 28px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.08)}
  .p082-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
  .p082-badges{display:flex;align-items:center;gap:6px;min-width:0;flex-wrap:wrap}
  .p082-badge{font-family:var(--mono);font-size:.58rem;letter-spacing:.06em;padding:4px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:rgba(255,255,255,.04)}
  .p082-badge.pulse{color:var(--cyan);border-color:rgba(43,212,229,.4);background:rgba(43,212,229,.08)}
  .p082-badge.status{color:var(--green);border-color:rgba(69,227,148,.3);background:rgba(69,227,148,.06)}
  .p082-badge.next{color:#061325;background:linear-gradient(180deg,#7eeaf3,var(--cyan));border:0;font-weight:700}
  .p082-time{font-family:var(--mono);font-size:.74rem;color:var(--sun);white-space:nowrap;text-align:right}
  .p082-name{font-family:var(--display);font-size:1.05rem;font-weight:700;letter-spacing:-.01em;margin-bottom:9px}
  .p082-route{display:grid;grid-template-columns:14px 1fr;column-gap:9px;row-gap:0;margin:5px 0 10px}
  .p082-route-rail{grid-row:1 / span 2;position:relative;min-height:46px}
  .p082-route-rail:before{content:"";position:absolute;left:6px;top:8px;bottom:8px;width:2px;background:linear-gradient(180deg,var(--cyan),var(--blue));opacity:.7}
  .p082-dot{position:absolute;left:2px;width:10px;height:10px;border-radius:50%;background:var(--ink);border:2px solid var(--cyan);box-shadow:0 0 0 3px rgba(43,212,229,.08)}
  .p082-dot.pick{top:2px}.p082-dot.drop{bottom:2px;border-color:var(--blue);box-shadow:0 0 0 3px rgba(76,147,255,.08)}
  .p082-route-line{font-size:.78rem;line-height:1.35;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:1px 0 6px}
  .p082-route-line small{display:block;font-family:var(--mono);font-size:.56rem;letter-spacing:.05em;color:var(--muted);text-transform:uppercase;margin-bottom:1px}
  .p082-meta{display:flex;align-items:center;justify-content:space-between;gap:9px;padding-top:9px;border-top:1px solid var(--line)}
  .p082-fare{font-family:var(--display);font-size:1.04rem;font-weight:700;color:var(--green)}
  .p082-fare small{display:block;font-family:var(--mono);font-size:.55rem;font-weight:500;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
  .p082-actions{display:flex;align-items:center;justify-content:flex-end;gap:7px;flex-wrap:wrap}
  .p082-actions button{min-height:38px;padding:0 11px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.045);font-family:var(--display);font-size:.7rem;font-weight:700}
  .p082-actions button.p082-start{background:linear-gradient(180deg,#8ff5c1,var(--green) 55%,#1f9c63);color:#04220f;border:0}
  .p082-actions button:disabled{opacity:.42;cursor:default}
  .p082-empty{font-size:.76rem;color:var(--muted);padding:2px 1px}
</style>
<script>
(function(){
  var PULSE069_CFG={movementMiles:0.08,arrivingSoonMiles:0.60,arrivedMiles:0.08,stoppedMs:20000,stationarySpeedMetersPerSecond:0.8,stationaryMiles:0.015,maxAccuracyMeters:100};
  var PULSE069={watch:null,timer:null,last:null,busy:false,error:'',paused:false};
  var p069BaseCancelActive=cancelActive;
  var p069BaseDropOff=dropOff;
  var PULSE081_FARE_KEY='pulse-direct-ride-fares-v1';
  var PULSE081_FARE_TTL_MS=14*24*3600000;
  var p081BaseRequestsFromServer=requestsFromServer;
  var p081BaseSchedFromServer=schedFromServer;
  var p081BaseScheduledTripState=scheduledTripState;
  var p081BaseQueueTripLog=queueTripLog_;
  var p082BaseRenderSched=renderSched;

  function p081FareMap_(){
    var map={};
    try{map=JSON.parse(localStorage.getItem(PULSE081_FARE_KEY)||'{}')||{};}catch(e){map={};}
    if(!map||typeof map!=='object'||Array.isArray(map))map={};
    var cutoff=now()-PULSE081_FARE_TTL_MS,changed=false;
    Object.keys(map).forEach(function(id){var entry=map[id]||{},fare=Number(entry.fare),at=Number(entry.at);if(!isFinite(fare)||fare<0||!isFinite(at)||at<cutoff){delete map[id];changed=true;}});
    if(changed){try{localStorage.setItem(PULSE081_FARE_KEY,JSON.stringify(map));}catch(e){}}
    return map;
  }
  function p081RememberRequests_(payload){
    var list=Array.isArray(payload)?payload:((payload&&payload.items)||[]),map=p081FareMap_(),changed=false;
    (list||[]).forEach(function(r){var id=String((r&&r.requestId)||'').trim(),raw=r&&r.quotedFare;if(raw===null||raw===''||raw===undefined)return;var fare=Number(raw);if(id&&isFinite(fare)&&fare>=0){map[id]={fare:fare,at:now()};changed=true;}});
    if(changed){try{localStorage.setItem(PULSE081_FARE_KEY,JSON.stringify(map));}catch(e){}}
  }
  function p081FareFor_(requestId){var id=String(requestId||'').trim(),entry=p081FareMap_()[id]||{},fare=Number(entry.fare);return id&&isFinite(fare)&&fare>=0?fare:null;}

  function p069Rider_(){return S.active&&S.active.requestId?S.active:null;}
  function p069Status_(){var a=p069Rider_();return a?(a.riderStatus||'Confirmed'):'';}
  function p069NeedsWatch_(){var s=p069Status_();return s==='Leaving'||s==='On the way'||s==='Arriving soon';}
  function p069Point_(lat,lng){lat=Number(lat);lng=Number(lng);return isFinite(lat)&&isFinite(lng)?[lat,lng]:null;}
  function p069Target_(){var a=p069Rider_(),t=a&&a.pickupTarget;return t?p069Point_(t.lat,t.lng):null;}
  function p069MapPoint_(){
    try{if(meMarker&&meMarker.getLatLng){var p=meMarker.getLatLng();return p069Point_(p.lat,p.lng);}}catch(e){}
    var a=p069Rider_();return a&&a.pickupLast?p069Point_(a.pickupLast[0],a.pickupLast[1]):null;
  }
  function p069Label_(){
    var a=p069Rider_();if(!a)return '';
    if(PULSE069.error)return PULSE069.error;
    if(document.hidden||PULSE069.paused)return 'foreground paused';
    if(isFinite(Number(a.pickupDistanceMiles)))return Number(a.pickupDistanceMiles).toFixed(2)+' mi to pickup';
    if(PULSE069.watch!=null)return 'foreground GPS active';
    return 'foreground GPS ready';
  }
  function p069Stop_(paused){
    if(PULSE069.watch!=null&&navigator.geolocation){navigator.geolocation.clearWatch(PULSE069.watch);PULSE069.watch=null;}
    if(PULSE069.timer!=null){clearInterval(PULSE069.timer);PULSE069.timer=null;}
    PULSE069.paused=!!paused;
  }
  function p069PersistPoint_(a,point,position,step){
    var origin=a.pickupOrigin&&p069Point_(a.pickupOrigin[0],a.pickupOrigin[1]);
    var displacement=origin?seg(origin,point):0;
    var accumulated=Math.max(0,Number(a.pickupMovedMiles)||0);
    if(isFinite(step)&&step>=0&&step<0.5)accumulated+=step;
    a.pickupMovedMiles=Math.max(accumulated,displacement);
    a.pickupLast=point;
    a.pickupLastAt=now();
    a.pickupAccuracyMeters=Number(position&&position.coords&&position.coords.accuracy)||null;
  }
  function p069Publish_(status){
    var a=p069Rider_();if(!a||PULSE069.busy||riderFlowBusy)return Promise.resolve(null);
    PULSE069.busy=true;PULSE069.error='';render();
    return advanceRiderStatus_(status).then(function(result){
      PULSE069.busy=false;
      if(status==='Arrived')p069Stop_(false);
      persistState();render();
      setTimeout(p069EvaluateLast_,0);
      return result;
    }).catch(function(error){
      PULSE069.busy=false;
      var detail=error&&error.message?String(error.message):String(error||'');
      detail=detail.trim().slice(0,180);
      PULSE069.error='Could not publish '+status+(detail?': '+detail:'');
      toast(PULSE069.error);
      render();
      return null;
    });
  }
  function p069Evaluate_(position){
    var a=p069Rider_();if(!a||!p069NeedsWatch_()||document.hidden)return;
    var target=p069Target_();
    if(!target){PULSE069.error=a.pickupTargetError||'pickup GPS target unavailable';render();return;}
    var accuracy=Number(position&&position.coords&&position.coords.accuracy);
    if(!isFinite(accuracy)||accuracy>PULSE069_CFG.maxAccuracyMeters){PULSE069.error='GPS accuracy too low';render();return;}
    PULSE069.error='';
    var point=p069Point_(position.coords.latitude,position.coords.longitude);if(!point)return;
    var previous=a.pickupLast&&p069Point_(a.pickupLast[0],a.pickupLast[1]);
    var step=previous?seg(previous,point):0;
    p069PersistPoint_(a,point,position,step);
    var remaining=seg(point,target);a.pickupDistanceMiles=remaining;
    var speed=Number(position.coords.speed);
    var stationary=isFinite(speed)&&speed>=0?speed<=PULSE069_CFG.stationarySpeedMetersPerSecond:step<=PULSE069_CFG.stationaryMiles;
    var status=p069Status_();
    if(status==='Leaving'&&Number(a.pickupMovedMiles)>=PULSE069_CFG.movementMiles){persistState();render();p069Publish_('On the way');return;}
    if(status==='On the way'&&remaining<=PULSE069_CFG.arrivingSoonMiles){persistState();render();p069Publish_('Arriving soon');return;}
    if(status==='Arriving soon'&&remaining<=PULSE069_CFG.arrivedMiles){
      if(stationary){if(!a.pickupStoppedSince)a.pickupStoppedSince=now();}
      else a.pickupStoppedSince=0;
      if(a.pickupStoppedSince&&now()-a.pickupStoppedSince>=PULSE069_CFG.stoppedMs){persistState();render();p069Publish_('Arrived');return;}
    }else if(status==='Arriving soon')a.pickupStoppedSince=0;
    persistState();render();
  }
  function p069EvaluateLast_(){if(PULSE069.last)p069Evaluate_(PULSE069.last);}
  function p069Resume_(){
    var a=p069Rider_();if(!a||!p069NeedsWatch_()||document.hidden){p069Stop_(!!document.hidden);return;}
    if(!navigator.geolocation){PULSE069.error='GPS unavailable';render();return;}
    if(!p069Target_()){PULSE069.error=a.pickupTargetError||'pickup GPS target unavailable';render();return;}
    if(PULSE069.watch!=null)return;
    PULSE069.paused=false;PULSE069.error='';
    PULSE069.watch=navigator.geolocation.watchPosition(function(position){PULSE069.last=position;p069Evaluate_(position);},function(){PULSE069.error='GPS permission or signal unavailable';render();},{enableHighAccuracy:true,maximumAge:3000,timeout:15000});
    PULSE069.timer=setInterval(p069EvaluateLast_,5000);
    render();
  }

  requestsFromServer=function(payload){p081RememberRequests_(payload);return p081BaseRequestsFromServer.apply(this,arguments);};
  schedFromServer=function(list){
    var result=p081BaseSchedFromServer.apply(this,arguments);
    (S.scheduled||[]).forEach(function(s){if(s&&s.requestId&&s.quotedFare==null){var fare=p081FareFor_(s.requestId);if(fare!=null)s.quotedFare=fare;}});
    renderSched();
    return result;
  };
  scheduledTripState=function(s){
    var ride=p081BaseScheduledTripState.apply(this,arguments),fare=s&&s.quotedFare!=null?Number(s.quotedFare):p081FareFor_(ride&&ride.requestId);
    if(ride&&isFinite(fare)&&fare>=0)ride.quotedFare=fare;
    return ride;
  };
  queueTripLog_=function(payload){
    if(payload&&payload.requestId&&(payload.fare===''||payload.fare==null)){var fare=p081FareFor_(payload.requestId);if(fare!=null)payload.fare=fare;}
    return p081BaseQueueTripLog.apply(this,arguments);
  };


  function p082When_(s){
    var diff=(Number(s.whenTS)||0)-now(),mins=Math.round(diff/60000);
    if(!isFinite(diff))return '';
    if(mins>90)return new Date(s.whenTS).toLocaleString([],{weekday:'short',hour:'numeric',minute:'2-digit'});
    if(mins>=0)return 'in '+mins+'m';
    return Math.abs(mins)+'m ago';
  }
  function p082Due_(s){var diff=(Number(s.whenTS)||0)-now();return isFinite(diff)&&diff<=30*60000&&diff>-60*60000;}
  function p082Fare_(s){var raw=s&&s.quotedFare;if(raw===null||raw===''||raw===undefined)return null;var fare=Number(raw);return isFinite(fare)&&fare>=0?fare:null;}
  function p082Button_(label,cls,disabled,handler){var b=document.createElement('button');b.type='button';b.textContent=label;b.className=cls||'';b.disabled=!!disabled;b.onclick=handler;return b;}

  renderSched=function(){
    var lane=$('schedList');if(!lane)return;lane.innerHTML='';
    var rides=(S.scheduled||[]).slice().sort(function(a,b){return (a.whenTS||0)-(b.whenTS||0)});
    if(!rides.length){var empty=document.createElement('div');empty.className='p082-empty';empty.textContent='No upcoming rides';lane.appendChild(empty);return;}
    var nextPulse='';
    rides.some(function(x){if(x&&x.source==='rider'){nextPulse=x.id;return true;}return false;});
    rides.forEach(function(s){
      var pulse=s.source==='rider',featured=pulse&&s.id===nextPulse,due=p082Due_(s),fare=p082Fare_(s);
      var card=document.createElement('div');card.className='sched-card p082-card'+(featured?' p082-featured':'')+(due?' due':'');
      var top=document.createElement('div');top.className='p082-top';
      var badges=document.createElement('div');badges.className='p082-badges';
      if(featured){var next=document.createElement('span');next.className='p082-badge next';next.textContent='NEXT PULSE RIDE';badges.appendChild(next);}
      var source=document.createElement('span');source.className='p082-badge'+(pulse?' pulse':'');source.textContent=pulse?'PULSE DIRECT':'SCHEDULED';badges.appendChild(source);
      if(pulse){var status=document.createElement('span');status.className='p082-badge status';status.textContent=s.riderStatus||'Confirmed';badges.appendChild(status);}
      top.appendChild(badges);
      var time=document.createElement('div');time.className='p082-time';time.textContent=(due?'DUE · ':'')+p082When_(s);top.appendChild(time);card.appendChild(top);

      var name=document.createElement('div');name.className='p082-name';name.textContent=s.name||'Ride';card.appendChild(name);
      var route=document.createElement('div');route.className='p082-route';
      var rail=document.createElement('div');rail.className='p082-route-rail';rail.innerHTML='<i class="p082-dot pick"></i><i class="p082-dot drop"></i>';route.appendChild(rail);
      var pick=document.createElement('div');pick.className='p082-route-line';pick.innerHTML='<small>Pickup</small>'+esc(s.pickup||'Pickup not set');route.appendChild(pick);
      var drop=document.createElement('div');drop.className='p082-route-line';drop.innerHTML='<small>Destination</small>'+esc(s.dest||'Destination not set');route.appendChild(drop);card.appendChild(route);

      var meta=document.createElement('div');meta.className='p082-meta';
      var fareBox=document.createElement('div');fareBox.className='p082-fare';fareBox.innerHTML=fare!=null?('<small>Pulse fare</small>$'+money(fare)):('<small>Ride</small>'+esc(pulse?'Direct':'Scheduled'));meta.appendChild(fareBox);
      var acts=document.createElement('div');acts.className='p082-actions';
      if(s.pickup)acts.appendChild(p082Button_('Pickup','',false,function(){navTo(s.pickup)}));
      if(s.dest)acts.appendChild(p082Button_('Drop','',false,function(){navTo(s.dest)}));
      acts.appendChild(p082Button_('Begin pickup','p082-start',!!scheduledStartBusy[s.id]||!!S.active||!!S.queued,function(){startScheduled(s.id)}));
      if(!pulse)acts.appendChild(p082Button_('×','',false,function(){srv('removeReservation',s.id).then(function(list){schedFromServer(list)}).catch(function(){});}));
      meta.appendChild(acts);card.appendChild(meta);lane.appendChild(card);
    });
  };

  startScheduled=function(id){
    var s=S.scheduled.filter(function(x){return x.id===id})[0];if(!s||scheduledStartBusy[id])return;
    if(s.requestId&&((S.active&&S.active.requestId===s.requestId)||(S.queued&&S.queued.requestId===s.requestId))){toast('Ride already started');return;}
    if(S.active||S.queued){toast('Finish current ride first');return;}
    if(!S.shift)goOnline();
    scheduledStartBusy[id]=true;renderSched();
    var departure=p069MapPoint_();
    function release(){delete scheduledStartBusy[id];renderSched();}
    function begin(result){
      var ride=scheduledTripState(s);
      if(s.source==='rider'){
        ride.riderStatus=(result&&result.status)||'Leaving';
        ride.pickupTarget=(result&&result.pickupTarget)||null;
        ride.pickupTargetError=(result&&result.pickupTargetError)||'';
        ride.pickupOrigin=departure;
        ride.pickupMovedMiles=0;
        ride.pickupStoppedSince=0;
      }
      S.active=ride;persistState();schedFromServer((result&&result.reservations)||[]);release();toast('Pickup started: '+s.name);render();p069Resume_();
    }
    var pickupCall=srv('beginForegroundPickup',s.requestId||'',id,s.pickup||'');
    if(s.pickup)navTo(s.pickup);
    pickupCall.then(begin).catch(function(e){release();PULSE069.error=e&&e.message?e.message:'Could not begin pickup';toast(PULSE069.error);render();});
  };

  renderRiderFlow=function(){
    var box=$('riderFlow'),actions=$('riderFlowActions');actions.innerHTML='';
    var a=S.active;if(!isRiderRide_(a)){box.classList.remove('show');p069Stop_(false);return;}
    box.classList.add('show');var st=riderStatus_(a),label=p069Label_();$('riderFlowStatus').textContent=st+(label?' · '+label:'');
    if(st==='Leaving'||st==='On the way'||st==='Arriving soon'){
      actions.appendChild(riderActionButton_('Navigate pickup',false,function(){navTo(a.pickup)}));
      p069Resume_();
    }else if(st==='Arrived'){
      p069Stop_(false);
      actions.appendChild(riderActionButton_('Start ride',true,function(){p069Stop_(false);advanceRiderStatus_('Ride in progress',function(){a.state='ON_TRIP';a.pickedUpAt=now();startTrace();toast('Ride in progress')})}));
    }else if(st==='Ride in progress'){
      p069Stop_(false);
      actions.appendChild(riderActionButton_('Navigate destination',false,function(){navTo(a.dest)}));
      actions.appendChild(riderActionButton_('Complete ride',true,function(){advanceRiderStatus_('Complete',function(){dropOff()})}));
    }else if(st==='Complete'){
      p069Stop_(false);actions.appendChild(riderActionButton_('Complete',false,function(){}));actions.firstChild.disabled=true;
    }
  };

  cancelActive=function(){p069Stop_(false);return p069BaseCancelActive.apply(this,arguments);};
  dropOff=function(){p069Stop_(false);return p069BaseDropOff.apply(this,arguments);};
  document.addEventListener('visibilitychange',function(){if(document.hidden)p069Stop_(true);else p069Resume_();});
  window.addEventListener('focus',p069Resume_);
  setTimeout(function(){p081RememberRequests_(S.requests||[]);render();p069Resume_();},0);
})();
</script>
